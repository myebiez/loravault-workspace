; Pragmatic Programmer: "Decoupling Configuration". 
; Credentials are injected dynamically during the build process, never hardcoded in logic.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
build_flags =
    -D WIFI_SSID=\"YOUR_WIFI_SSID\"
    -D WIFI_PASS=\"YOUR_WIFI_PASS\"
    -D SUPABASE_URL=\"YOUR_SUPABASE_URL\"
    -D SUPABASE_KEY=\"YOUR_SUPABASE_ANON_KEY\"
    -D GATEWAY_TOKEN=\"secret_esp32_hmac_token\"